/* ============================================================

/* ---------- 参数（v2.1 定稿；右上标定面板可临时覆盖） ---------- */
const P = {
  W: 960, H: 540, groundY: 472, playerScreenX: 210, ppm: 26,
  vPlayer: 60 / 3.6,                 // 16.67 m/s
  vOnMin: 60 / 3.6, vOnMax: 150 / 3.6,
  climb: 1.44, climbCap: 6.5,        // 线性爬升；车底帽（牌下沿 8 m − 车高 1.5 m）
  rotStart: 1.40, omega: 360,        // 起转阈值；恒定角速度，松手即停
  g: 20, landWin: 30, corrStep: 30, tapMaxDur: 0.20,
  warnLead: 2.0, tgScale: 1.0,
  carW: 2.0, carH: 1.8, playerW: 2.0, playerH: 1.5,
  bbBottom: 8.0, bbTop: 11.6, bbW: 3.2,
  carsToClear: 5, spawnAhead: 55, despawnBehind: 25,
};
function recalc(){ P.holdCap = P.climbCap / P.climb; P.maxL = Math.max(0.1, P.holdCap - P.rotStart); }
recalc();

/* ---------- 纯逻辑：角度 / 修正 / 评分 ---------- */
function mod360(a){ a = a % 360; return a < 0 ? a + 360 : a; }
function distToLevel(a){ const r = mod360(a); return Math.min(r, 360 - r); }
/* 轻触：朝最近的 360 倍数步进 corrStep°（r<180 向后回退，r>=180 向前补） */
function corrTap(th){ const r = mod360(th); return r >= 180 ? th + P.corrStep : th - P.corrStep; }
/* 单跳得分：高度 5 分 + 圈数 5 分，各按比例，封顶 10（v2.1 §5） */
function jumpScore(apex, L){
  const a = Math.min(apex, P.climbCap) / P.climbCap;
  const l = Math.min(L, P.maxL) / P.maxL;
  return Math.min(10, 10 * (0.5 * a + 0.5 * l));
}
function avgScore(){ return G && G.jumps.length ? G.jumps.reduce((s, j) => s + j.score, 0) / G.jumps.length : 0; }
/* 玩家可见分值：×1000 展示口径（M2 决策，见文档区） */
function disp(score){ return Math.round(score * 1000); }
/* 可复现随机数（mulberry32） */
function mulberry32(s){ return function(){ s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
/* 难度曲线：t_g = 车 k 之前的间隙（v2.2 §6：5 辆版——四段边界不变，按间隙重映射） */
function tgBand(k){
  if(k === 0) return [6, 7];        // 死代码：首遇固定 4 s 头部，不存在「车 1 前的间隙」；教学宽容由 4 s + 警示 2 s 提供（首间隙实际取车 2 档）
  if(k <= 2) return [4.5, 6];       // 车 2、3 前（间隙 1→2 / 2→3）：1 圈保底
  if(k === 3) return [3.5, 5];      // 车 4 前（间隙 3→4）：2 圈开始有代价
  return [2.6, 3.5];                // 车 5 前（间隙 4→5）：终局过渡（用户实测可过，维持不改）
}

/* ---------- 局状态 ---------- */
let G = null;
function makeGame(seed, mode){
  const rng = mulberry32(seed);
  const meetT = [], carV = [];
  let t = 4.0;                                   // 第 1 辆 4 s 后相遇（教学局）
  for(let k = 0; k < P.carsToClear; k++){
    if(k > 0){ const b = tgBand(k); t += (b[0] + (b[1] - b[0]) * rng()) * P.tgScale; }
    meetT.push(t);
    carV.push(P.vOnMin + (P.vOnMax - P.vOnMin) * rng());
  }
  const billboards = [];
  let bx = 42;
  while(bx < 980){ billboards.push({ x: bx }); bx += 38 + rng() * 22; }
  return {
    seed, mode: mode || 'play', paused: false, t: 0,
    px: 0, py: 0, vy: P.climb, grounded: true,
    holdActive: false, holdCum: 0, hRel: 0, apexPhys: 0,
    thetaRaw: 0, thetaCorr: 0, thetaRel: 0, taps: 0, jumpT0: 0, autoReleased: false,
    cars: [], nextIdx: 0, metUpTo: 0,
    warnCar: null, warnedFor: -1, passUnders: 0,
    jumps: [], jumpCount: 0, toasts: [],
    pendingClear: -1, crashReason: '', note: null,
    press: null, meetT, carV, billboards,
    stats: { taps: 0, relErrSum: 0, landCount: 0 },
  };
}
function newRun(seed){ G = makeGame(seed == null ? (Math.random() * 1e9 | 0) : seed, 'play'); }
function toast(text){ if(G) G.toasts.push({ text, t: 0, ttl: 1.8 }); }
function statsHtml(){
  const s = G.stats;
  const avgTaps = s.landCount ? (s.taps / s.landCount).toFixed(1) : '0';
  const avgErr = s.landCount ? (s.relErrSum / s.landCount).toFixed(0) : '0';
  return '起跳 ' + G.jumps.length + ' 次 · 空中错车 ' + G.passUnders + ' 次 · 平均轻触 ' + avgTaps + ' 次/跳 · 平均松手偏差 ' + avgErr + '°';
}

/* ---------- 跳跃动作 ---------- */
function beginJump(){
  G.grounded = false; G.holdActive = true; G.holdCum = 0;
  G.thetaRaw = 0; G.thetaCorr = 0; G.thetaRel = 0;
  G.hRel = 0; G.py = 0; G.vy = P.climb; G.apexPhys = 0;
  G.taps = 0; G.jumpT0 = G.t; G.autoReleased = false;
  G.jumpCount++;
}
function doRelease(auto){
  if(!G.holdActive) return;
  G.holdActive = false;
  G.vy = P.climb;                 // 松手余速：上抛约 5 cm（v2.1 存疑 #7）
  G.thetaRel = G.thetaRaw;        // 信用在松手瞬间冻结
  G.autoReleased = !!auto;
}
function corrTapOnce(){
  G.thetaCorr = corrTap(G.thetaCorr);
  G.taps++;
  sfx.tap();
}
function landJump(){
  G.grounded = true; G.holdActive = false;
  const L = Math.min(Math.min(G.thetaRel, G.thetaCorr) / 360, P.maxL);   // 信用 = min(松手角, 修正后角)
  const s = jumpScore(G.hRel, L);
  G.jumps.push({ apex: G.hRel, L, score: s, taps: G.taps, hold: G.holdCum, relErr: distToLevel(G.thetaRel) });
  G.stats.taps += G.taps;
  G.stats.relErrSum += distToLevel(G.thetaRel);
  G.stats.landCount++;
  toast('顶点 ' + G.hRel.toFixed(2) + ' m · ' + L.toFixed(2) + ' 圈 · ' + disp(s) + ' 分' + (G.taps ? ' · 轻触×' + G.taps : ''));
  sfx.land();
}
function crash(reason){
  if(G.mode !== 'play') return;
  G.mode = 'crash';
  G.crashReason = reason;
  sfx.crash();
}

/* ---------- 输入（纯状态） ---------- */
function pressStart(src){
  if(!G || G.mode !== 'play' || G.paused) return;
  if(G.press) return;
  G.press = { src, t0: G.t };
  if(G.grounded) beginJump();
}
function pressEnd(src){
  if(!G || !G.press || G.press.src !== src) return;
  const dur = G.t - G.press.t0;
  G.press = null;
  if(G.mode !== 'play') return;
  if(G.grounded){ G.holdActive = false; return; }
  if(G.holdActive){ doRelease(false); return; }
  if(dur <= P.tapMaxDur) corrTapOnce();
  else G.note = { text: '已松手，不能继续爬升（M1 口径）', ttl: 1.4 };
}

/* ---------- 物理步进（固定 1/120 s） ---------- */
function step(dt){
  if(!G || G.mode !== 'play' || G.paused) return;
  G.t += dt;
  G.px += P.vPlayer * dt;

  /* 生成对向车：按相遇时刻精确布点（d = 剩余时间 × 闭合速度）。
     出场距离须保证 ≥ warnLead 秒的警示窗（v2.2 修复：固定 55m 时 150 km/h 对向车
     只提前 0.94s 入场，横幅/倒计时/屏外箭头被砍到不足 1s，违背锁定的 warnLead=2.0） */
  while(G.nextIdx < P.carsToClear){
    const k = G.nextIdx;
    const d = (G.meetT[k] - G.t) * (P.vPlayer + G.carV[k]);
    const need = Math.max(P.spawnAhead, P.warnLead * (P.vPlayer + G.carV[k]) + 8);
    if(d > need) break;
    G.cars.push({ k, x: G.px + d, v: G.carV[k], passUnder: false });
    G.nextIdx++;
  }
  for(const c of G.cars) c.x -= c.v * dt;
  G.cars = G.cars.filter(c => c.x > G.px - P.despawnBehind);

  /* 玩家垂直运动：按住线性爬升（帽 6.5）；松手余速上抛后自由落体 */
  if(!G.grounded){
    if(G.holdActive){
      G.holdCum += dt;
      G.thetaRaw = P.omega * Math.max(0, G.holdCum - P.rotStart);
      G.thetaCorr = G.thetaRaw;
      G.hRel = Math.min(P.climb * G.holdCum, P.climbCap);
      G.py = G.hRel;
      G.vy = P.climb;
      if(G.holdCum >= P.holdCap - 1e-9) doRelease(true);      // 高度帽自动松手
    } else {
      const vy0 = G.vy;
      G.vy = vy0 - P.g * dt;
      G.py = G.py + vy0 * dt - 0.5 * P.g * dt * dt;
    }
    if(G.py > G.apexPhys) G.apexPhys = G.py;
  }

  /* 碰撞：对向车（车底高于 1.8 m 车顶 = 从其腋下穿过） */
  for(const c of G.cars){
    if(Math.abs(c.x - G.px) < (P.carW + P.playerW) / 2 - 1e-9){
      if(G.py >= P.carH - 1e-9){
        if(!c.passUnder){ c.passUnder = true; G.passUnders++; toast('躲过！'); }
      } else { crash('撞上第 ' + (c.k + 1) + ' 辆对向车'); return; }
    }
  }
  /* 碰撞：广告牌（车顶 vs 牌下沿 8 m） */
  if(G.py + P.playerH >= P.bbBottom - 1e-9){
    for(const b of G.billboards){
      if(Math.abs(b.x - G.px) < (P.bbW + P.playerW) / 2 - 1e-9){ crash('顶到广告牌'); return; }
    }
  }

  /* 落地：修正后朝向须在整圈 ±landWin° 内 */
  if(!G.grounded && !G.holdActive && G.py <= 0 && G.vy < 0){
    G.py = 0;
    const dev = distToLevel(G.thetaCorr);
    if(dev > P.landWin){ crash('落地姿势不正 · 偏差 ' + dev.toFixed(0) + '°（窗 ±' + P.landWin + '°）'); return; }
    landJump();
  }

  /* 警示：相遇前 warnLead 秒激活（最近一辆未处理的车） */
  let target = null;
  for(const c of G.cars){ if(G.t < G.meetT[c.k] + 0.25){ target = c; break; } }
  G.warnCar = target;
  if(target && G.t >= G.meetT[target.k] - P.warnLead && G.warnedFor !== target.k){
    G.warnedFor = target.k;
    sfx.warn();
  }

  /* 过关计数与通关（结算等最后一跳落地，避免吞掉未落地起跳的分） */
  while(G.metUpTo < P.carsToClear && G.t >= G.meetT[G.metUpTo] + 0.25) G.metUpTo++;
  if(G.metUpTo >= P.carsToClear && G.pendingClear < 0) G.pendingClear = 0.9;
  if(G.pendingClear >= 0 && G.grounded){
    G.pendingClear -= dt;
    if(G.pendingClear <= 0 && G.mode === 'play'){ G.mode = 'clear'; sfx.clear(); }
  }

  for(const ts of G.toasts) ts.t += dt;
  G.toasts = G.toasts.filter(ts => ts.t < ts.ttl);
  if(G.note && G.note.ttl > 0){ G.note.ttl -= dt; if(G.note.ttl <= 0) G.note = null; }
}

/* ============================================================
   以下为浏览器层：素材 / 音效 / 像素场景渲染 / HUD / 面板 / 输入
   ============================================================ */
let AC = null, muted = false;
function ensureAudio(){
  if(!AC){ try{ AC = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ AC = null; } }
  if(AC && AC.state === 'suspended') AC.resume();
}
function tone(f, d, type, v, delay){
  if(!AC || muted) return;
  try{
    const t0 = AC.currentTime + (delay || 0);
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type || 'sine'; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(v || 0.12, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
    o.connect(g); g.connect(AC.destination);
    o.start(t0); o.stop(t0 + d + 0.05);
  }catch(e){}
}
const sfx = {
  warn(){ tone(880, .07, 'square', .10); tone(880, .07, 'square', .10, .11); },
  tap(){ tone(1245, .03, 'sine', .07); },
  land(){ tone(520, .06, 'sine', .09); },
  crash(){ tone(170, .35, 'sawtooth', .16); tone(85, .45, 'square', .12, .03); },
  clear(){ tone(523, .12, 'sine', .11); tone(659, .12, 'sine', .11, .12); tone(784, .2, 'sine', .11, .24); },
  jump(){ tone(300, .07, 'square', .05); tone(470, .09, 'square', .04, .05); },
  ui(){ tone(700, .05, 'square', .07); },
};

/* ---------- 存档 ---------- */
function best(){ try{ return parseFloat(localStorage.getItem('m2_best_v1')) || 0; }catch(e){ return 0; } }
function saveBest(v){ try{ localStorage.setItem('m2_best_v1', String(v)); }catch(e){} }
function plays(){ try{ return parseInt(localStorage.getItem('m2_plays_v1')) || 0; }catch(e){ return 0; } }
function addPlay(){ try{ localStorage.setItem('m2_plays_v1', String(plays() + 1)); }catch(e){} }

/* ---------- 云埋点：全局开局计数（不分用户；insert-only 事件表 game_starts，计数 = COUNT(*)） ---------- */
var wbCloud = null, globalStarts = null;
function initCloud(){
  try{
    if(!window.WorkBuddyCloud || !window.PUBLIC_CONFIG) return null;
    wbCloud = window.WorkBuddyCloud.createWorkBuddyCloud({
      endpoint: window.PUBLIC_CONFIG.endpoint,
      oauthRelayBaseUrl: window.PUBLIC_CONFIG.oauthRelayBaseUrl,
      publishableKey: window.PUBLIC_CONFIG.publishableKey
    });
  }catch(e){ wbCloud = null; }
  return wbCloud;
}
function gcountText(){ return globalStarts == null ? '—' : String(globalStarts); }
function paintGcount(){
  document.querySelectorAll('[data-gcount]').forEach(function(el){ el.textContent = gcountText(); });
}
/* 开局埋点：fire-and-forget，失败不阻塞游戏 */
function bumpStarts(){
  if(!wbCloud) return;
  try{
    Promise.resolve(wbCloud.database.from('game_starts').insert({}))
      .then(function(){ refreshGcount(); })
      .catch(function(){});
  }catch(e){}
}
function refreshGcount(){
  if(!wbCloud) return;
  try{
    Promise.resolve(wbCloud.database.from('game_starts').select('*', { count: 'exact', head: true }))
      .then(function(r){
        if(r && !r.error && r.count != null){ globalStarts = r.count; paintGcount(); }
      })
      .catch(function(){});
  }catch(e){}
}

/* ---------- 场景常量与配色（采样自素材图 4 / 1 / 5） ---------- */
const SC = { horizon: 344, grassBot: 372, railTop: 372, railBot: 400, roadTop: 400, roadBot: 500, dirtTop: 500 };
const C = {
  skyTop:'#1b51f9', skyMid:'#228efd', skyLow:'#39def4', skyHor:'#6cfff7',
  cloud:'#ffffff', cloudSh:'#d9eef5',
  grass:'#15c74d', grassHi:'#14ce61', grassDk:'#023c14', tuft:'#0a5c26',
  rail:'#d3d3d1', railSh:'#8e96a5', post:'#363a43', postDk:'#14181f',
  roadLine:'#ece2e0', road:'#29363e', roadDk:'#1a1b1f', dash:'#cfd0d2',
  dirt:'#40251a', dirtSp1:'#6c4734', dirtSp2:'#332012', dirtTuft:'#0fd14a',
  bb:'#141926', bbFrame:'#2e3850', bbBlock:'#3e4e6e', bbAcc:'#e8b13c', leg:'#0d1220',
};
/* 车精灵在局中的显示尺寸（高 = 物理车高；宽 = 高 × 素材宽高比） */
const CAR = { mH: Math.round(P.carH * P.ppm), mW: Math.round(P.carH * P.ppm * 2.665),
              pH: Math.round(P.playerH * P.ppm), pW: Math.round(P.playerH * P.ppm * 3.421) };

function initBrowser(){
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  const stage = document.getElementById('stage');
  const ids = {};
  ['topcars','topavg','topbest','warnbox','warnfill','debug','panel','paused'].forEach(id => ids[id] = document.getElementById(id));
  loadEmbedded();

  function resize(){
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = Math.round(P.W * dpr); cv.height = Math.round(P.H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  resize();
  window.addEventListener('resize', resize);

  /* ---------- 像素场景 ---------- */
  const cloudRng = mulberry32(20261018);
  const clouds = [];
  for(let i = 0; i < 26; i++) clouds.push({ x: i * 58 + cloudRng() * 26, y: 24 + cloudRng() * 180, s: 5 + Math.floor(cloudRng() * 4) });

  function pixelCloud(cx, cy, s){
    cx = Math.round(cx); cy = Math.round(cy);
    ctx.fillStyle = C.cloud;
    ctx.fillRect(cx - 2 * s, cy - s, 4 * s, 2 * s);
    ctx.fillRect(cx - 3 * s, cy - Math.round(s * 0.5), 2 * s, Math.round(1.5 * s));
    ctx.fillRect(cx + s, cy - Math.round(s * 0.5), 2 * s, Math.round(1.5 * s));
    ctx.fillStyle = C.cloudSh;
    ctx.fillRect(cx - 2 * s, cy + Math.round(s * 0.6), 4 * s, Math.round(s * 0.5));
  }
  function drawSky(){
    const g = ctx.createLinearGradient(0, 0, 0, SC.horizon);
    g.addColorStop(0, C.skyTop); g.addColorStop(0.45, C.skyMid);
    g.addColorStop(0.78, C.skyLow); g.addColorStop(1, C.skyHor);
    ctx.fillStyle = g; ctx.fillRect(0, 0, P.W, SC.horizon);
  }
  function drawClouds(camX){
    const span = P.W + 260;
    for(const cl of clouds){
      const x = ((cl.x * P.ppm - camX * 0.30 * P.ppm) % span + span) % span - 130;
      pixelCloud(x, cl.y, cl.s);
    }
  }
  function drawGrass(camX){
    ctx.fillStyle = C.grass; ctx.fillRect(0, SC.horizon, P.W, SC.grassBot - SC.horizon);
    ctx.fillStyle = C.grassHi; ctx.fillRect(0, SC.horizon, P.W, 3);
    ctx.fillStyle = C.grassDk; ctx.fillRect(0, SC.grassBot - 3, P.W, 3);
    const per = 1.1 * P.ppm;
    const off = (camX * 0.55 * P.ppm) % per;
    for(let i = -1; i < P.W / per + 2; i++){
      const x = Math.round(i * per - off);
      ctx.fillStyle = C.tuft;
      ctx.fillRect(x, 352, 4, 6); ctx.fillRect(x + 6, 355, 3, 4);
      if(i % 2 === 0){ ctx.fillRect(x + 12, 350, 3, 5); }
    }
  }
  function drawGuardrail(camX){
    const per = 4 * P.ppm;
    const off = (camX * 0.8 * P.ppm) % per;
    ctx.fillStyle = C.rail; ctx.fillRect(0, SC.railTop, P.W, 9);
    ctx.fillStyle = C.railSh; ctx.fillRect(0, SC.railTop + 7, P.W, 3);
    for(let i = -1; i < P.W / per + 2; i++){
      const x = Math.round(i * per - off);
      ctx.fillStyle = C.post; ctx.fillRect(x, SC.railTop + 1, 6, SC.railBot - SC.railTop - 1);
      ctx.fillStyle = C.postDk; ctx.fillRect(x, SC.railTop + 1, 2, SC.railBot - SC.railTop - 1);
      ctx.fillStyle = C.rail; ctx.fillRect(x - 1, SC.railTop - 2, 8, 3);
    }
  }
  function drawRoad(camX){
    ctx.fillStyle = C.road; ctx.fillRect(0, SC.roadTop + 4, P.W, SC.roadBot - SC.roadTop - 4);
    ctx.fillStyle = C.roadLine; ctx.fillRect(0, SC.roadTop, P.W, 4);
    ctx.fillStyle = C.roadDk; ctx.fillRect(0, SC.roadBot - 12, P.W, 12);
    const per = 4 * P.ppm;
    const off = (camX * P.ppm) % per;
    for(let i = -1; i < P.W / per + 2; i++){
      ctx.fillStyle = C.dash;
      ctx.fillRect(Math.round(i * per - off), 478, 2 * P.ppm, 4);
    }
  }
  function drawDirt(camX){
    ctx.fillStyle = C.dirt; ctx.fillRect(0, SC.dirtTop, P.W, P.H - SC.dirtTop);
    ctx.fillStyle = 'rgba(0,0,0,.28)'; ctx.fillRect(0, SC.dirtTop, P.W, 2);
    const per = 1.7 * P.ppm;
    const off = (camX * 1.05 * P.ppm) % per;
    for(let i = -1; i < P.W / per + 2; i++){
      const x = Math.round(i * per - off);
      ctx.fillStyle = C.dirtSp1; ctx.fillRect(x + 3, 508, 4, 2); ctx.fillRect(x + 12, 517, 3, 2);
      ctx.fillStyle = C.dirtSp2; ctx.fillRect(x + 8, 522, 3, 2); ctx.fillRect(x + 16, 511, 2, 2);
      if(i % 2 === 0){ ctx.fillStyle = C.dirtTuft; ctx.fillRect(x + 14, 503, 3, 5); ctx.fillRect(x + 17, 506, 2, 3); }
    }
  }
  function drawBillboard(x, SY){
    const w = Math.round(P.bbW * P.ppm);
    const yTop = Math.round(SY(P.bbTop)), yBot = Math.round(SY(P.bbBottom));
    ctx.fillStyle = C.leg;
    ctx.fillRect(x - 26, yBot, 5, P.groundY - yBot);
    ctx.fillRect(x + 21, yBot, 5, P.groundY - yBot);
    ctx.fillStyle = C.bb; ctx.fillRect(x - w / 2, yTop, w, yBot - yTop);
    ctx.strokeStyle = C.bbFrame; ctx.lineWidth = 2;
    ctx.strokeRect(x - w / 2 + 1, yTop + 1, w - 2, yBot - yTop - 2);
    ctx.fillStyle = C.bbBlock; ctx.fillRect(x - w / 2 + 8, yTop + 8, w - 16, 26);
    ctx.fillStyle = 'rgba(255,255,255,.10)'; ctx.fillRect(x - w / 2 + 8, yTop + 8, w - 16, 5);
    ctx.fillStyle = C.bbAcc; ctx.fillRect(x - w / 2 + 8, yTop + 40, 18, 6); ctx.fillRect(x + w / 2 - 26, yTop + 40, 18, 6);
    ctx.fillStyle = 'rgba(255,255,255,.13)'; ctx.fillRect(x - w / 2 + 8, yTop + 52, w - 16, 4);
    ctx.fillStyle = C.bbAcc; ctx.fillRect(x - w / 2, yBot - 7, w, 5);
  }
  function drawCarImg(img, x, y, w, h, color, dark){
    if(ready(img)){ ctx.drawImage(img, x, y, w, h); return; }
    ctx.fillStyle = color; ctx.fillRect(x, y, w, h);
    ctx.fillStyle = dark; ctx.fillRect(x + w * 0.14, y + h * 0.2, w * 0.38, h * 0.38);
    ctx.fillStyle = '#1a1a1a';
    const wr = h * 0.36;
    ctx.fillRect(x + w * 0.14, y + h - wr, wr, wr); ctx.fillRect(x + w * 0.6, y + h - wr, wr, wr);
  }

  /* ---------- 烟尘粒子（素材图6） ---------- */
  const dust = [];
  function spawnDust(wx, wy, n, power){
    for(let i = 0; i < n; i++){
      dust.push({
        x: wx + (Math.random() - 0.5) * 1.6, y: wy + Math.random() * 0.25,
        vx: (Math.random() - 0.5) * 2.4 * power, vy: (0.4 + Math.random() * 1.4) * power,
        t: 0, ttl: 0.4 + Math.random() * 0.25, r: 3 + Math.random() * 4,
      });
    }
  }
  function updateDust(dt){
    for(const p of dust){ p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy -= 2.2 * dt; }
    for(let i = dust.length - 1; i >= 0; i--) if(dust[i].t >= dust[i].ttl) dust.splice(i, 1);
  }
  function drawDust(camX){
    for(const p of dust){
      const a = 1 - p.t / p.ttl;
      const r = p.r * (1 + p.t * 2.4);
      ctx.fillStyle = 'rgba(255,255,255,' + (a * 0.85).toFixed(3) + ')';
      ctx.fillRect(Math.round((p.x - camX) * P.ppm - r / 2), Math.round(P.groundY - p.y * P.ppm - r / 2), Math.round(r), Math.round(r));
    }
  }

  /* ---------- 主渲染 ---------- */
  let titleCv = null;
  function getTitleCv(){
    if(titleCv) return titleCv;
    const c = document.createElement('canvas');
    c.width = 150; c.height = 24;
    const g = c.getContext('2d');
    g.font = 'bold 16px "SimHei","Microsoft YaHei","PingFang SC",sans-serif';
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillStyle = '#1a0508'; g.fillText('中美汽车大PK', 76, 13);
    const gr = g.createLinearGradient(0, 2, 0, 22);
    gr.addColorStop(0, '#ffc53a'); gr.addColorStop(0.55, '#f04a2a'); gr.addColorStop(1, '#c4160e');
    g.fillStyle = gr; g.fillText('中美汽车大PK', 75, 12);
    titleCv = c;
    return c;
  }

  let shakeT = 0;
  function render(){
    const camX = G.px - P.playerScreenX / P.ppm;
    const SX = wx => (wx - camX) * P.ppm;
    const SY = wy => P.groundY - wy * P.ppm;
    ctx.save();
    if(shakeT > 0){
      ctx.translate(Math.round((Math.random() - 0.5) * 6), Math.round((Math.random() - 0.5) * 6));
    }
    /* 标题屏：封面图全幅（大标题 + 双车 + 开始按钮烤入图中）；封面缺失时回退到场景构图 */
    if(G.mode === 'title' && ready(A.cover)){
      ctx.imageSmoothingEnabled = true;
      ctx.drawImage(A.cover, 0, 0, P.W, P.H);
      ctx.restore();
      return;
    }
    drawSky();
    drawClouds(camX);
    drawGrass(camX);
    drawGuardrail(camX);
    drawRoad(camX);
    drawDirt(camX);

    /* 广告牌（8–11.6 m 深色剪影面板 + 双支架，与碰撞盒同宽） */
    for(const b of G.billboards){
      const x = Math.round(SX(b.x));
      if(x < -120 || x > P.W + 120) continue;
      drawBillboard(x, SY);
    }

    /* 标题屏静物构图：装饰对向车 + 装饰广告牌（不参与物理） */
    if(G.mode === 'title'){
      drawBillboard(Math.round(SX(G.px + 8.5)), SY);
      const dx = Math.round(SX(G.px + 16.5));
      drawCarImg(A.oncoming, dx - CAR.mW / 2, P.groundY - CAR.mH, CAR.mW, CAR.mH, '#8a97a5', '#5d6a75');
    }

    /* 对向车（与玩家车同一条道路：车底贴地面线，初始同高度） */
    for(const c of G.cars){
      const x = Math.round(SX(c.x));
      if(x < -CAR.mW || x > P.W + CAR.mW) continue;
      drawCarImg(A.oncoming, x - CAR.mW / 2, P.groundY - CAR.mH, CAR.mW, CAR.mH, '#8a97a5', '#5d6a75');
      const isWarn = G.warnCar === c && G.t >= G.meetT[c.k] - P.warnLead && G.t < G.meetT[c.k] + 0.25;
      if(isWarn){
        ctx.strokeStyle = Math.sin(G.t * 18) > 0 ? '#e0b13c' : '#e05252';
        ctx.lineWidth = 3;
        ctx.strokeRect(x - CAR.mW / 2 - 3, P.groundY - CAR.mH - 3, CAR.mW + 6, CAR.mH + 6);
        const cd = Math.max(0, G.meetT[c.k] - G.t);
        ctx.fillStyle = 'rgba(0,0,0,.5)'; ctx.fillRect(x - 26, P.groundY - CAR.mH - 15, 52, 6);
        ctx.fillStyle = '#ffd166'; ctx.fillRect(x - 26, P.groundY - CAR.mH - 15, Math.max(0, 52 * (cd / P.warnLead)), 6);
      }
    }

    drawDust(camX);

    /* 屏外警示箭头（只给倒计时，不给距离/车速——下一辆不可读） */
    const wc = G.warnCar;
    if(wc && G.t >= G.meetT[wc.k] - P.warnLead && G.t < G.meetT[wc.k]){
      if(SX(wc.x) > P.W - 30){
        ctx.fillStyle = '#e05252';
        ctx.beginPath();
        ctx.moveTo(P.W - 12, P.groundY - 92); ctx.lineTo(P.W - 34, P.groundY - 104); ctx.lineTo(P.W - 34, P.groundY - 80);
        ctx.closePath(); ctx.fill();
        ctx.font = 'bold 13px ui-monospace,monospace'; ctx.textAlign = 'right'; ctx.fillStyle = '#fff';
        ctx.fillText(Math.max(0, G.meetT[wc.k] - G.t).toFixed(1) + ' s', P.W - 40, P.groundY - 88);
      }
    }

    /* 玩家车 */
    if(G){
      const x = Math.round(SX(G.px)), y = Math.round(SY(G.py));
      const shA = 0.3 * (1 - Math.min(G.py, 8) / 14);
      if(shA > 0.02){
        const shW = Math.max(12, CAR.pW * 0.5 * (1 - Math.min(G.py, 8) / 12));
        ctx.fillStyle = 'rgba(0,0,0,' + shA.toFixed(3) + ')';
        ctx.fillRect(x - shW / 2, P.groundY + 1, shW, 3);
      }
      if(G.py > 0.25){
        ctx.save(); ctx.strokeStyle = 'rgba(255,255,255,.45)'; ctx.lineWidth = 2; ctx.setLineDash([3, 5]);
        ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, P.groundY); ctx.stroke(); ctx.restore();
      }
      ctx.save();
      ctx.translate(x, y - CAR.pH / 2);
      ctx.rotate(G.thetaCorr * Math.PI / 180);
      drawCarImg(A.player, -CAR.pW / 2, -CAR.pH / 2, CAR.pW, CAR.pH, '#c0392b', '#7d2418');
      ctx.restore();
      if(!G.grounded){
        const dev = distToLevel(G.thetaCorr);
        ctx.font = 'bold 12px ui-monospace,monospace'; ctx.textAlign = 'center';
        ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(0,0,0,.6)';
        const label = mod360(G.thetaCorr).toFixed(0) + '°';
        ctx.strokeText(label, x, y - CAR.pH - 9);
        ctx.fillStyle = dev <= P.landWin ? '#b9f6ca' : '#ff8a80';
        ctx.fillText(label, x, y - CAR.pH - 9);
      }
    }

    /* 浮动提示 */
    for(const ts of G.toasts){
      ctx.globalAlpha = Math.max(0, 1 - ts.t / ts.ttl);
      ctx.font = 'bold 12px ui-monospace,monospace'; ctx.textAlign = 'center';
      ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(0,0,0,.6)';
      const tx = SX(G.px) + 52, ty = SY(G.py) - 74 - ts.t * 26;
      ctx.strokeText(ts.text, tx, ty);
      ctx.fillStyle = 'rgba(255,255,255,.95)'; ctx.fillText(ts.text, tx, ty);
      ctx.globalAlpha = 1;
    }

    /* 标题屏像素大标题（素材图5） */
    if(G.mode === 'title'){
      const tc = getTitleCv();
      const w = 150 * 4.7, h = 24 * 4.7;
      ctx.imageSmoothingEnabled = false;
      ctx.drawImage(tc, Math.round((P.W - w) / 2), 34, w, h);
      ctx.imageSmoothingEnabled = true;
    }
    ctx.restore();
  }

  /* ---------- HUD ---------- */
  function anchor(t){
    const h = P.climb * Math.min(t, P.holdCap);
    const L = Math.max(0, Math.min(t, P.holdCap) - P.rotStart);
    return (10 * (0.5 * Math.min(h, P.climbCap) / P.climbCap + 0.5 * Math.min(L, P.maxL) / P.maxL)).toFixed(1);
  }
  function updateHUD(){
    if(G.mode === 'play' && !G.paused){
      const Lnow = Math.min(Math.min(G.thetaRel, G.thetaCorr) / 360, P.maxL);
      const wk = G.warnCar ? G.warnCar.k : G.metUpTo;
      const tg = wk + 1 < P.carsToClear ? (G.meetT[wk + 1] - G.meetT[wk]).toFixed(1) : '—';
      const v = G.warnCar ? (G.carV[G.warnCar.k] * 3.6).toFixed(0) : '—';
      const air = G.grounded ? 0 : G.t - G.jumpT0;
      const note = G.note ? '\n' + G.note.text : '';
      ids.debug.textContent =
        '车 ' + G.metUpTo + '/' + P.carsToClear + ' · t ' + G.t.toFixed(1) + 's · 种子 ' + G.seed + (G.autoReleased ? ' · 已到帽' : '') + '\n' +
        (G.grounded
          ? '地面待机 · 按下起跳（基本技：按约 2.4 s = 1 圈）'
          : (G.holdActive ? '按住 ' + G.holdCum.toFixed(2) + ' s' : '已松手 · 滞空 ' + air.toFixed(2) + ' s') +
            ' · 松手高度 ' + G.hRel.toFixed(2) + ' m · 真实顶点 ' + G.apexPhys.toFixed(2) + ' m\n' +
            '角 ' + mod360(G.thetaRaw).toFixed(0) + '°→' + mod360(G.thetaCorr).toFixed(0) + '°' +
            ' · 圈 ' + (G.thetaRaw / 360).toFixed(2) + '→' + Lnow.toFixed(2) +
            ' · 轻触 ' + G.taps + ' · 松手偏差 ' + distToLevel(G.thetaRel).toFixed(0) + '°') + '\n' +
        '下一辆 t_g ' + tg + ' s · 当前车速 ' + v + ' km/h（DEBUG 原始 0–10 分）\n' +
        '起跳 ' + G.jumps.length + ' · 空中错车 ' + G.passUnders + ' · 均分 ' + avgScore().toFixed(2) +
        ' · 锚点 按3s≈' + anchor(3) + ' 按4s≈' + anchor(4) + ' 按满=' + anchor(P.holdCap) + note;
    }
    ids.topcars.textContent = G.metUpTo + '/' + P.carsToClear;
    ids.topavg.textContent = G.jumps.length ? String(disp(avgScore())) : '—';
    ids.topbest.textContent = best() ? String(disp(best())) : '—';
  }
  function updateWarn(){
    const wc = G.warnCar;
    const active = wc && G.t >= G.meetT[wc.k] - P.warnLead && G.t < G.meetT[wc.k] + 0.25;
    ids.warnbox.classList.toggle('on', !!active && G.mode === 'play');
    if(active) ids.warnfill.style.width = (100 * (1 - (G.meetT[wc.k] - G.t) / P.warnLead)).toFixed(1) + '%';
  }

  /* ---------- 面板（标题 / 坠毁 / 结算） ---------- */
  let modeChangedAt = 0;
  function primaryAction(){
    if(performance.now() - modeChangedAt < 700) return;      // 防误触立即重开
    ensureAudio(); sfx.ui();
    if(G.mode === 'title'){ G.mode = 'play'; }
    else newRun();
    bumpStarts();                                            // 云埋点：每次开始游戏 +1
  }
  function goHome(){
    ensureAudio(); sfx.ui();
    newRun(); G.mode = 'title';
  }
  function leaderboardRows(myScore){
    const board = [{ n: '车神', s: 9999 }, { n: '老司机', s: 8200 }, { n: '玩家你', s: myScore, you: true }];
    board.sort((a, b) => b.s - a.s);
    return board.map((r, i) =>
      '<div class="rrow' + (r.you ? ' you' : '') + '"><span class="medal m' + (i + 1) + '">' + (i + 1) + '</span>' +
      '<span class="nm">' + r.n + '</span><b>' + r.s + '分</b></div>').join('');
  }
  function showPanel(){
    const p = ids.panel;
    if(G.mode === 'play'){ p.classList.remove('on'); p.classList.remove('dim', 'titlemode'); return; }
    let html = '';
    if(G.mode === 'title'){
      p.classList.remove('dim'); p.classList.add('titlemode');
      html = '<div class="t-cover-tech">' +
        '对向车冲过来——按住起跳（空格 / 按住屏幕），按得越久跳越高、圈越多<br>' +
        '松手停转；下落中轻触把车捋平（每下 30°，扣一点圈数）——对齐整圈松手最省<br>' +
        '<span class="zero">连躲 5 辆通关 · 撞车 / 摔车 / 顶广告牌 = 0 分</span></div>' +
        '<button class="pbtn cover-hit" data-act="start" aria-label="开始游戏"></button>' +
        '<div class="t-cover-best">最高 <b>' + (best() ? disp(best()) : '—') + '</b> 分 · 已玩 ' + plays() + ' 局</div>';
    } else if(G.mode === 'crash'){
      p.classList.remove('titlemode'); p.classList.add('dim');
      html = '<div class="rcard"><div class="rhead">坠毁</div>' +
        '<div class="rreason">' + G.crashReason + '</div>' +
        '<div class="rcur">当前得分：<b>0</b></div>' +
        '<div class="rmeta">全网开局 <span data-gcount>' + gcountText() + '</span> 次 · 躲过 ' + G.metUpTo + ' / ' + P.carsToClear + ' 辆 · ' + statsHtml() + '</div>' +
        '<div class="rbtns"><button class="pbtn" data-act="again">再来一局</button><button class="pbtn" data-act="home">返回主页</button></div></div>';
    } else if(G.mode === 'clear'){
      const a = avgScore();
      p.classList.remove('titlemode'); p.classList.add('dim');
      html = '<div class="rcard"><div class="rhead">比赛结算</div>' +
        '<div class="rrows">' + leaderboardRows(disp(a)) + '</div>' +
        '<div class="rcur">当前得分：<b>' + disp(a) + '</b></div>' +
        '<div class="rmeta">游戏次数：' + (plays() + 1) + ' · 全网开局 <span data-gcount>' + gcountText() + '</span> 次 · 躲过 ' + P.carsToClear + '/' + P.carsToClear +
        ' · 起跳 ' + G.jumps.length + ' 次' + (G.passUnders ? ' · 空中错车 ' + G.passUnders + ' 次' : '') +
        ' · 平均轻触 ' + (G.stats.landCount ? (G.stats.taps / G.stats.landCount).toFixed(1) : '0') + ' 次/跳</div>' +
        '<div class="rbtns"><button class="pbtn" data-act="again">再来一局</button><button class="pbtn" data-act="home">返回主页</button></div></div>';
    }
    p.innerHTML = html;
    p.classList.add('on');
    if(G.mode === 'clear' || G.mode === 'crash') refreshGcount();   /* 兜底：结算/坠毁屏拉到最新全网开局数 */
  }
  ids.panel.addEventListener('pointerdown', e => {
    const btn = e.target.closest('[data-act]');
    if(btn){
      e.preventDefault(); e.stopPropagation();
      const act = btn.getAttribute('data-act');
      ensureAudio(); sfx.ui();
      if(act === 'start' || act === 'again') primaryAction();
      else if(act === 'home') goHome();
      btn.blur();   /* 交还焦点：否则随后按空格/回车会再次触发按钮 = 重开新局而非起跳 */
      return;
    }
    if(G.mode !== 'play' && e.target === ids.panel){ e.preventDefault(); primaryAction(); }
  });

  function onModeChange(){
    modeChangedAt = performance.now();
    stage.className = 'mode-' + G.mode;
    if(G.mode === 'clear'){
      const a = avgScore();
      if(a > best()) saveBest(a);
      addPlay();
    } else if(G.mode === 'crash'){
      addPlay();
    }
    ids.paused.classList.remove('on');
    G.paused = false;
    showPanel();
  }

  /* ---------- 输入 ---------- */
  let lastJumpCount = 0, lastLanded = 0, lastMode = 'title';
  cv.addEventListener('pointerdown', e => {
    e.preventDefault(); ensureAudio();
    try{ cv.setPointerCapture(e.pointerId); }catch(err){}
    if(G.mode === 'title'){ primaryAction(); return; }
    pressStart('pointer');
  });
  window.addEventListener('pointerup', () => pressEnd('pointer'));
  window.addEventListener('pointercancel', () => pressEnd('pointer'));
  window.addEventListener('keydown', e => {
    const ae = document.activeElement;   /* 任何按键先撤按钮焦点（修复：点开始后按空格=重开） */
    if(ae && ae.classList && ae.classList.contains('pbtn')) ae.blur();
    if(e.code === 'Space'){
      e.preventDefault();
      if(e.repeat) return;
      ensureAudio();
      if(G.mode !== 'play'){ primaryAction(); return; }
      pressStart('key');
    }
    else if(e.code === 'Escape'){ if(G.mode !== 'play') goHome(); }
    else if(e.code === 'KeyH') ids.debug.classList.toggle('off');
    else if(e.code === 'KeyR'){ if(G.mode !== 'title'){ newRun(); bumpStarts(); } }
    else if(e.code === 'KeyP'){ if(G.mode === 'play'){ G.paused = !G.paused; ids.paused.classList.toggle('on', G.paused); } }
    else if(e.code === 'KeyM'){ muted = !muted; }
  });
  window.addEventListener('keyup', e => { if(e.code === 'Space'){ e.preventDefault(); pressEnd('key'); } });
  document.addEventListener('visibilitychange', () => {
    if(document.hidden && G.mode === 'play' && !G.paused){ G.paused = true; ids.paused.classList.add('on'); }
  });
  document.addEventListener('contextmenu', e => e.preventDefault());
  const rot = document.getElementById('rotate');   /* 横屏提示：点却继续；横屏时 CSS 自动隐藏 */
  if(rot) rot.addEventListener('pointerdown', () => rot.classList.add('hide'));

  /* ---------- 参数标定 ---------- */
  const TUNE = [
    ['climb',  's_climb', 'l_climb', v => { P.climb = v; recalc(); }, v => v.toFixed(2)],
    ['rotStart','s_rot',  'l_rot',   v => { P.rotStart = v; recalc(); }, v => v.toFixed(2)],
    ['omega',  's_om',    'l_om',    v => { P.omega = v; }, v => v.toFixed(0)],
    ['g',      's_g',     'l_g',     v => { P.g = v; }, v => v.toFixed(0)],
    ['landWin','s_win',   'l_win',   v => { P.landWin = v; }, v => '±' + v.toFixed(0)],
    ['corrStep','s_cs',   'l_cs',    v => { P.corrStep = v; }, v => v.toFixed(0)],
    ['warnLead','s_wl',   'l_wl',    v => { P.warnLead = v; }, v => v.toFixed(1)],
    ['tgScale','s_tg',    'l_tg',    v => { P.tgScale = v; }, v => v.toFixed(2)],
  ];
  try{
    const saved = JSON.parse(localStorage.getItem('m2_tune_v1') || '{}');
    TUNE.forEach(t => { if(saved[t[0]] != null) t[3](saved[t[0]]); });
  }catch(e){}
  TUNE.forEach(t => {
    const input = document.getElementById(t[1]), lab = document.getElementById(t[2]);
    input.value = P[t[0]];
    lab.textContent = t[4](P[t[0]]);
    input.addEventListener('input', () => {
      const v = parseFloat(input.value);
      t[3](v);
      lab.textContent = t[4](v);
      try{
        const o = {}; TUNE.forEach(x => o[x[0]] = P[x[0]]);
        localStorage.setItem('m2_tune_v1', JSON.stringify(o));
      }catch(e){}
    });
    input.addEventListener('pointerdown', e => e.stopPropagation());
  });

  /* ---------- 主循环 ---------- */
  const FIXED = 1 / 120;
  let last = performance.now(), acc = 0;
  function loop(now){
    requestAnimationFrame(loop);
    let dt = (now - last) / 1000; last = now;
    if(dt > 0.25) dt = 0.25;
    acc += dt;
    let n = 0;
    while(acc >= FIXED && n < 40){ step(FIXED); acc -= FIXED; n++; }
    if(n >= 40) acc = 0;

    /* 特效钩子：起跳烟 / 落地烟 / 坠毁爆 + 震屏 */
    if(G.mode === 'play'){
      if(G.jumpCount !== lastJumpCount){
        if(G.jumpCount > lastJumpCount) spawnDust(G.px, 0.12, 7, 1);
        lastJumpCount = G.jumpCount;
      }
      if(G.jumps.length !== lastLanded){
        if(G.jumps.length > lastLanded) spawnDust(G.px, 0.05, 5, 0.8);
        lastLanded = G.jumps.length;
      }
    }
    if(G.mode !== lastMode){
      if(G.mode === 'crash'){ spawnDust(G.px, G.py + 0.1, 12, 1.5); shakeT = 0.35; }
      if(G.mode === 'clear') shakeT = 0;
      lastMode = G.mode;
      onModeChange();
    }
    if(shakeT > 0) shakeT -= dt;
    updateDust(dt);
    render(); updateHUD(); updateWarn();
  }
  newRun(); G.mode = 'title'; lastMode = 'title';
  showPanel();
  if(initCloud()) refreshGcount();   /* 云埋点初始化：拉一次全网开局数（失败则显示「—」） */
  requestAnimationFrame(loop);

  window.M2 = {
    get G(){ return G; }, get P(){ return P; },
    newRun, pressStart, pressEnd, makeGame, step,
    jumpScore, corrTap, distToLevel, mod360, avgScore, statsHtml, disp,
  };
}

if(typeof window !== 'undefined' && typeof document !== 'undefined' && document.getElementById && document.getElementById('cv')){
  initBrowser();
}
</script>
</body>
</html>
